<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Foodeez QR Poster</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; font-family: "Plus Jakarta Sans", system-ui, sans-serif; background: #FBF8F3; color: #1C1A17; }
    .tools { max-width: 520px; margin: 0 auto; padding: 20px 16px; }
    .tools label { display: block; font-size: 13px; font-weight: 700; margin: 12px 0 6px; }
    .tools input, .tools select { width: 100%; height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid #E5DED2; font: inherit; font-size: 15px; box-sizing: border-box; }
    .tools button { margin-top: 14px; height: 48px; width: 100%; border: 0; border-radius: 12px; background: #1C1A17; color: #fff; font: inherit; font-weight: 800; font-size: 16px; cursor: pointer; }
    .tools p { font-size: 13px; color: #6b645b; }
    .poster { width: 420px; max-width: calc(100% - 32px); margin: 10px auto 40px; background: #FDBA2E; border-radius: 28px; padding: 28px 24px; text-align: center; box-sizing: border-box; }
    .poster img.logo { width: 92px; height: 92px; border-radius: 50%; margin: 0 auto 6px; display: block; }
    .poster h1 { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -.03em; }
    .poster .tag { margin: 2px 0 16px; font-weight: 700; }
    .qr { background: #fff; border-radius: 20px; padding: 18px; width: 250px; margin: 0 auto; }
    .qr svg { width: 100%; height: auto; display: block; }
    .poster .cta { font-size: 22px; font-weight: 800; margin: 16px 0 4px; }
    .poster .steps { font-size: 14px; font-weight: 600; }
    .poster .foot { margin-top: 14px; font-size: 13px; font-weight: 700; }
    @media print { .tools { display: none; } body { background: #fff; } .poster { margin-top: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
  </style>
</head>
<body>
  <div class="tools">
    <h2 style="margin:0">QR poster maker</h2>
    <p>After you put the website online, paste its link here, choose the menu, then print or screenshot the poster.</p>
    <label for="url">Website link</label>
    <input id="url" placeholder="https://foodeez.pages.dev" />
    <label for="loc">Which menu should this QR open?</label>
    <select id="loc"><option value="cart">Foodeez Cart (with Popcorn Momos)</option><option value="shop">Foodeez Shop</option></select>
    <button onclick="window.print()">Print poster</button>
    <p id="link"></p>
  </div>

  <div class="poster">
    <img class="logo" src="img/logo.png" alt="" />
    <h1>Foodeez</h1>
    <div class="tag">Cart to Yummy, Always Yummy!</div>
    <div class="qr" id="qr"></div>
    <div class="cta">Scan to order 🥟</div>
    <div class="steps">Scan → Add momos → Pay → Done!</div>
    <div class="foot">+91 73038 59375 · Opp. Cleo County, Sector 121</div>
  </div>

  <script src="vendor/qrcode.js"></script>
  <script>
    const url = document.getElementById("url"), loc = document.getElementById("loc");
    url.value = localStorage.getItem("fz_siteurl") || location.href.replace(/qr\.html.*$/, "");
    function draw() {
      localStorage.setItem("fz_siteurl", url.value.trim());
      let base = url.value.trim() || location.origin + "/";
      const u = new URL(base, location.href); u.searchParams.set("loc", loc.value);
      const qr = qrcode(0, "M"); qr.addData(u.href); qr.make();
      document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
      document.getElementById("link").textContent = "QR opens: " + u.href;
    }
    url.oninput = draw; loc.onchange = draw; draw();
  </script>
</body>
</html>
